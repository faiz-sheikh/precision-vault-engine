[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-vault-engine"
version = "0.1.0"
description = "Crash-safe, provider-neutral study-content operating system"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit==1.49.1"]
test = ["pytest==8.3.5"]

[project.scripts]
pve = "pve.cli:main"

[tool.setuptools.packages.find]
include = ["pve*"]

[tool.setuptools.package-data]
pve = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
