[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-vault-engine"
version = "0.1.0"
description = "Crash-safe, provider-neutral study-content operating system"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit==1.49.1"]
test = ["pytest==8.3.5"]
verify = [
  "build==1.3.0",
  "mypy==1.17.1",
  "pytest==8.3.5",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
  "streamlit==1.49.1",
]

[project.scripts]
pve = "pve.cli:main"

[tool.setuptools.packages.find]
include = ["pve*"]

[tool.setuptools.package-data]
pve = ["fixtures/*.json", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", "_remotion_project"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Formatting is enforced; long SQL/prompt literals remain readable intact.

[tool.ruff.lint.per-file-ignores]
# Compatibility scripts retain their historical compact layout. Correctness rules remain enabled.
"{assessment_bank,audio_pipeline,config,curriculum_mapper,dedup_engine,domain_compiler,ingestion_researcher,jsonl_serializer,manifest_repair,overnight_batch_renderer,soft_skills_engine,synthesis_gate,visual_blueprint,viva_command_center,windows_bridge}.py" = [
  "E402", "E701", "E702", "I001", "RUF012", "SIM", "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pve"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true
